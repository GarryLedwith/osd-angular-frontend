name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Lambda — unit tests ────────────────────────────────────────────────
  ci-lambda:
    name: Lambda — Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install Lambda dependencies
        run: npm ci
        working-directory: lambda

      - name: Run Lambda unit tests
        run: npm run test:unit
        working-directory: lambda

  # Railway auto-deploys the frontend on every push to main via its GitHub integration.
  
