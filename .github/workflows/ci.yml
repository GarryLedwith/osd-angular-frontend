name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Angular frontend — tests + production build ────────────────────────
  ci-frontend:
    name: Angular — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: npx ng build --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/
          retention-days: 7

  # ── CI: Lambda — unit tests ────────────────────────────────────────────────
  ci-lambda:
    name: Lambda — Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Install Lambda dependencies
        run: npm ci
        working-directory: lambda

      - name: Run Lambda unit tests
        run: npm run test:unit
        working-directory: lambda

  # Railway auto-deploys the frontend on every push to main via its GitHub integration.
  
